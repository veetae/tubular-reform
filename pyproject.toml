[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubular-reform"
version = "0.2.0"
description = "Reform flattened 'tubular' text (one cell per line) back into a real table — ragged-safe, clipboard-native."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tubular-reform contributors" }]
keywords = [
    "table",
    "clipboard",
    "cli",
    "text-processing",
    "tsv",
    "csv",
    "markdown",
    "reshape",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = ["pyperclip>=1.8"]

[project.urls]
Homepage = "https://github.com/veetae/tubular-reform"
Repository = "https://github.com/veetae/tubular-reform"
Issues = "https://github.com/veetae/tubular-reform/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tubular-reform = "tubular_reform.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
